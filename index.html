<title>Critters Are People Too</title>  <link rel="apple-touch-icon" href="apple-touch-icon%202.png"><link rel="icon" href="apple-touch-icon%202.png"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen 3D space view. Pill toolbar + resource chips on top, news banners center-top, segmented Build/Critters/Planet tabs bottom-right. Single dark space look by choice. */
:root{
  --space:#05040f; --pill:#2b2a8c; --pill2:#3d3cb8; --pill-line:#7f80ff; --pill-ink:#d9dbff;
  --cyan:#5fd6ee; --cyan-ink:#14155a; --gold:#ffd447; --alert:#ff5a7a;
  --panel:#211f6e; --panel2:#2e2c96; --ink:#f2f2ff; --dim:#aeb0e8;
  --round:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--space);color:var(--ink);font-family:var(--round);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#overlay{position:fixed;inset:0;pointer-events:none;overflow:hidden}
/* top */
.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;flex-direction:column;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.era-pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:linear-gradient(var(--pill2),var(--pill));border:2px solid var(--pill-line);border-radius:999px;padding:4px 14px 4px 4px;min-width:170px;cursor:pointer;color:var(--pill-ink);font:600 15px var(--round)}
.era-pill .num{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#5a4400;display:grid;place-items:center;font:700 17px var(--round);flex:none}
.era-pill .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left}
.era-pill .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
.era-pill .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:5px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;max-width:100%;padding-block:2px;touch-action:pan-x}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:linear-gradient(var(--pill2),var(--pill));border:2px solid var(--pill-line);color:var(--pill-ink);font:600 14px var(--round);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--cyan);border-color:#bff3ff;color:var(--cyan-ink)}
.pill.hot{background:var(--gold);border-color:#fff1b0;color:#4a3700}
.pill:focus-visible,.seg button:focus-visible,.up:focus-visible,.big:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:rgba(30,28,110,.85);border:2px solid #4e4fd6;border-radius:999px;padding:4px 11px 4px 7px;font:600 14px var(--round);color:#fff;font-variant-numeric:tabular-nums}
.chip i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.chip span{color:var(--dim);font-weight:500;font-size:12px}
/* news */
.news{position:fixed;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:40;pointer-events:none;width:min(420px,calc(100% - 32px))}
.msg{background:linear-gradient(var(--panel2),var(--panel));border:2px solid #e9dcae;border-radius:14px;padding:10px 16px;font:600 15px/1.3 var(--round);text-align:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:msg 4.5s ease forwards}
@keyframes msg{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
/* station labels */
.st{position:absolute;left:0;top:0;width:120px;margin-left:-60px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .2s}
.st .amt{font:700 15px var(--round);color:#fff;text-shadow:0 2px 4px #000;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.st .amt i{width:10px;height:10px;border-radius:50%}
.ring{width:40px;height:40px;position:relative;pointer-events:auto;cursor:pointer;border-radius:50%;background:rgba(30,28,110,.75);border:2px solid #8d8eff;box-shadow:0 0 10px rgba(95,214,238,.5)}
.ring svg{position:absolute;inset:-2px;width:40px;height:40px;transform:rotate(-90deg)}
.ring svg circle{fill:none;stroke:var(--cyan);stroke-width:3.5;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 12px var(--round);color:#fff}
.st .lv{font:600 12px/1.2 var(--round);color:#fff;text-shadow:0 1px 3px #000;text-align:center;font-variant-numeric:tabular-nums}
.st.compact .up,.st.compact .rate{display:none}
.up{pointer-events:auto;margin-top:2px;background:linear-gradient(var(--pill2),var(--pill));border:2px solid var(--pill-line);color:#fff;border-radius:999px;padding:5px 11px;font:600 14px var(--round);display:flex;align-items:center;gap:5px;cursor:pointer;font-variant-numeric:tabular-nums;touch-action:none}
.up i{width:10px;height:10px;border-radius:50%}
.up.no{opacity:.5}
.float{position:absolute;font:700 19px var(--round);color:#fff;text-shadow:0 0 8px var(--cyan),0 2px 3px #000;animation:rise 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
.bubble{position:absolute;background:#fff;color:var(--cyan-ink);font:600 14px var(--round);padding:6px 10px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-100%);animation:pop 2s ease forwards}
@keyframes pop{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.meteor{position:absolute;width:38px;height:38px;border:none;padding:0;border-radius:50%;cursor:pointer;pointer-events:auto;background:radial-gradient(circle at 35% 30%,#fff7c4,var(--gold) 50%,#d98e04);box-shadow:0 0 18px 6px rgba(255,212,71,.7)}
/* bottom tabs */
.seg{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;background:linear-gradient(var(--pill2),var(--pill));border:2px solid var(--pill-line);border-radius:18px;overflow:hidden}
.seg button{background:none;border:none;color:var(--pill-ink);font:600 15px var(--round);padding:12px 16px;cursor:pointer;position:relative}
.seg button+button{border-left:1px solid rgba(127,128,255,.4)}
.seg .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--alert);box-shadow:0 0 6px var(--alert)}
.boost{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;font:600 14px var(--round);background:rgba(30,28,110,.85);border:2px solid #4e4fd6;border-radius:999px;padding:7px 12px;font-variant-numeric:tabular-nums}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(3,2,15,.55);z-index:200}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78%;margin:0 auto;max-width:620px;z-index:210;background:linear-gradient(var(--panel2),var(--panel));border:2px solid var(--pill-line);border-bottom:none;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{margin:0;font:700 22px var(--round)}
.close{width:36px;height:36px;border-radius:50%;border:2px solid var(--pill-line);background:var(--pill);color:#fff;font:600 18px var(--round);cursor:pointer}
.body{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:4px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:rgba(10,9,60,.45);border:2px solid #4e4fd6;border-radius:14px;padding:6px 8px}
.row .pic{width:54px;height:54px;border-radius:10px;background:radial-gradient(circle at 50% 70%,#3d6fd0,#151463);display:grid;place-items:center;overflow:hidden}
.row .pic img{max-width:50px;max-height:50px;width:auto}
.row .pic i{width:22px;height:22px;border-radius:50%;box-shadow:0 0 12px currentColor}
.row.locked .pic img{filter:brightness(0) opacity(.5)}
.row .info{min-width:0}
.row h3{margin:0;font:700 16px var(--round);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .no{font:700 11px var(--round);background:var(--cyan);color:var(--cyan-ink);border-radius:5px;padding:1px 6px}
.row p{margin:2px 0 0;font:500 13px var(--round);color:var(--dim);font-variant-numeric:tabular-nums}
.big{min-width:92px;border:2px solid #fff1b0;border-radius:12px;background:var(--gold);color:#4a3700;font:700 15px var(--round);padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.big small i{width:9px;height:9px;border-radius:50%}
.big:disabled{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:var(--dim);cursor:default}
.card{background:radial-gradient(circle at 80% 0,#4a49d0,#1b1a64);border:2px solid #e9dcae;border-radius:14px;padding:14px}
.card h3{margin:0 0 4px;font:700 22px var(--round)}
.card p{margin:0;color:var(--dim);font:500 15px var(--round)}
.note{font:500 13px var(--round);color:var(--dim);text-align:center;margin:4px 0 0}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font:600 18px var(--round)}
@media (prefers-reduced-motion:reduce){.float,.bubble,.msg{animation-duration:.01s}}
</style>

<canvas id="cv"></canvas>
<div id="overlay"></div>

<div class="top">
  <div class="row1">
    <button class="era-pill" id="eraPill" aria-label="Ages"><span class="num" id="eraNum">1</span><span class="txt"><span id="eraName">Stone Age</span><span class="bar"><i id="eraBar"></i></span></span></button>
  </div>
  <div class="pills">
    <button class="pill on" id="pLook">Close look</button>
    <button class="pill" id="pShower">Meteor shower</button>
    <button class="pill" id="pClouds">Clouds on</button>
    <button class="pill" id="pRing">Ring on</button>
    <button class="pill" id="pSet">Settings</button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="news" id="news"></div>
<div class="boost" id="boost" hidden></div>
<nav class="seg">
  <button id="tBuild">Build<span class="dot" id="dBuild" hidden></span></button>
  <button id="tCritters">Critters<span class="dot" id="dCritters" hidden></span></button>
  <button id="tPlanet">Planet<span class="dot" id="dPlanet" hidden></span></button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><header><h2 id="sheetTitle"></h2><button class="close" id="closeSheet" aria-label="Close">&times;</button></header><div class="body" id="sheetBody"></div></section>

const stationObjs=[];
function buildStations(){stationObjs.forEach(o=>spinG.remove(o));stationObjs.length=0;anim.length=0;
  STATIONS.forEach((s,i)=>{const o=i<=S.era?buildStation(s.key):buildSign();stationObjs.push(placeOn(o,sph(s.lat,s.lon),.055));});}
// trees
{const geo=new THREE.ConeGeometry(.012,.036,6);geo.translate(0,.018,0);const inst=new THREE.InstancedMesh(geo,new THREE.MeshPhongMaterial({flatShading:true,shininess:4}),520);
 const m=new THREE.Matrix4(),q=new THREE.Quaternion(),up=new THREE.Vector3(0,1,0),col=new THREE.Color();let n=0,tries=0;
 while(n<520&&tries<20000){tries++;const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();const h=hAt(v);if(h<0.05||Math.abs(v.y)>0.78)continue;if(SPOTS.some(p=>p.angleTo(v)<0.12))continue;
  q.setFromUnitVectors(up,v);const s=.7+Math.random()*.8;m.compose(v,q,new THREE.Vector3(s,s*(.8+Math.random()*.5),s));inst.setMatrixAt(n,m);col.set(Math.random()<.25?(Math.random()<.5?'#c96a4a':'#d9a03a'):(Math.random()<.5?'#2f7a48':'#3f9a5a'));inst.setColorAt(n,col);n++;}
 inst.count=n;spinG.add(inst);}

/* ---- critters as sprites ---- */
const loader=new THREE.TextureLoader();const walkers={};const spriteList=[];
function landPoint(){for(let k=0;k<500;k++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();if(hAt(v)>0.04&&Math.abs(v.y)<.75&&v.angleTo(sph(TOWN.lat,TOWN.lon))<1.3)return v;}return sph(TOWN.lat,TOWN.lon);}
function syncSprites(){CHARS.forEach(c=>{if(own(c.id)>0&&!walkers[c.id]){
  const tex=loader.load(IMGS[c.id],t=>{w.ar=t.image.width/t.image.height;});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,alphaTest:.3}));sp.center.set(.5,0);sp.userData.c=c;spinG.add(sp);spriteList.push(sp);
  const p=landPoint();const w={c,sp,tex,p,q:landPoint(),pause:Math.random()*2,hop:0,ar:.6,face:1};walkers[c.id]=w;}});}
function clearSprites(){for(const k in walkers){spinG.remove(walkers[k].sp);delete walkers[k];}spriteList.length=0;}
const _v=new THREE.Vector3(),_a=new THREE.Vector3(),_b=new THREE.Vector3();
function moveWalkers(dt,t){Object.values(walkers).forEach(w=>{
  if(w.pause>0)w.pause-=dt;else{const ang=w.p.angleTo(w.q),sp=.07*dt;if(ang<sp){w.p.copy(w.q);w.pause=1+Math.random()*3;w.q=landPoint();}else{_v.copy(w.q).sub(w.p.clone().multiplyScalar(w.p.dot(w.q))).normalize();w.p.multiplyScalar(Math.cos(sp)).addScaledVector(_v,Math.sin(sp)).normalize();
    if(hAt(w.p)<0.0){w.q=landPoint();}}}
  w.hop=Math.max(0,w.hop-dt*2.5);const hgt=.085*w.c.size;const lift=1.0+Math.sin(w.hop*Math.PI)*.04+(w.pause>0?0:Math.abs(Math.sin(t/130+w.p.x*30))*.004);
  w.sp.position.copy(w.p).multiplyScalar(lift);w.sp.scale.set(hgt*w.ar,hgt,1);
  // face direction on screen
  _a.copy(w.p).applyMatrix4(spinG.matrixWorld).project(camera);_b.copy(w.q).applyMatrix4(spinG.matrixWorld).project(camera);if(w.pause<=0&&Math.abs(_b.x-_a.x)>.002){const f=_b.x<_a.x?-1:1;if(f!==w.face){w.face=f;w.tex.repeat.x=f;w.tex.offset.x=f<0?1:0;}}
});}

/* ---- camera / input ---- */
let W=0,H=0,dist=6,distTarget=6,fitDist=6,close=false;
function resize(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();const tan=Math.tan(camera.fov*Math.PI/360);fitDist=Math.max(1.75/tan,1.45/(tan*camera.aspect));distTarget=close?fitDist*.5:fitDist;}
addEventListener('resize',resize);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let ptrs=new Map(),drag=null,velY=0,velX=0,pinch0=0;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);drag=null;return;}drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,id:e.pointerId};});
addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){distTarget=Math.max(fitDist*.35,Math.min(fitDist*1.4,distTarget*pinch0/d));pinch0=d;}return;}
  if(!drag||e.pointerId!==drag.id)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;
  if(drag.moved){const k=2.2/Math.min(W,H)*(dist/fitDist);const dx=(e.clientX-drag.lx)*k,dy=(e.clientY-drag.ly)*k;spinG.rotation.y+=dx;tilt.rotation.x=Math.max(-.8,Math.min(.9,tilt.rotation.x+dy));velY=dx*60;velX=dy*60;}drag.lx=e.clientX;drag.ly=e.clientY;});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(!drag||e.pointerId!==drag.id)return;if(!drag.moved&&e.target===cv)tapAt(e.clientX,e.clientY);drag=null;}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();distTarget=Math.max(fitDist*.35,Math.min(fitDist*1.4,distTarget*(1+e.deltaY*.001)));},{passive:false});
function tapAt(x,y){ndc.set(x/W*2-1,-(y/H)*2+1);ray.setFromCamera(ndc,camera);
  const hs=ray.intersectObjects(spriteList,false);const hp=ray.intersectObject(planet,false);
  if(hs.length&&(!hp.length||hs[0].distance<hp[0].distance+.02)){poke(hs[0].object.userData.c,x,y);return;}
  if(hp.length){const g=tapValue();S.coins+=g;floatText('+'+fmt(g),x,y);Object.values(walkers).forEach(w=>{if(Math.random()<.12)w.hop=1;});}}
function floatText(t,x,y){const f=document.createElement('div');f.className='float';f.textContent=t;f.style.left=x+'px';f.style.top=y+'px';overlay.appendChild(f);setTimeout(()=>f.remove(),1000);}
function poke(c,x,y){const w=walkers[c.id];w.hop=1;const g=tapValue()*3;S.coins+=g;floatText('+'+fmt(g),x,y);
  const b=document.createElement('div');b.className='bubble';b.textContent=c.name+': '+c.say[Math.floor(Math.random()*c.say.length)];b.style.left=Math.min(Math.max(x,100),W-100)+'px';b.style.top=(y-30)+'px';overlay.appendChild(b);setTimeout(()=>b.remove(),2000);}

/* ---- station labels ---- */
const LBL=[];let sel=Math.min(S.era,5);
STATIONS.forEach((s,i)=>{const d=document.createElement('div');d.className='st';
  d.innerHTML='<div class="amt">'+dot(i+1)+'<span></span></div><div class="ring" role="button" aria-label="Show '+s.name+'"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" stroke-dasharray="106.8" stroke-dashoffset="106.8"/></svg><b></b></div><div class="lv"></div><button class="up" aria-label="Upgrade '+s.name+'"></button>';
  overlay.appendChild(d);const btn=d.querySelector('.up');let hold,rep;const stop=()=>{clearTimeout(hold);clearInterval(rep);};
  d.querySelector('.ring').addEventListener('pointerdown',e=>{e.stopPropagation();sel=i;});
  btn.addEventListener('pointerdown',e=>{e.stopPropagation();upgrade(i);hold=setTimeout(()=>rep=setInterval(()=>upgrade(i),90),400);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();upgrade(i);}});
  LBL.push({d,amt:d.querySelector('.amt span'),c:d.querySelector('circle'),b:d.querySelector('.ring b'),lv:d.querySelector('.lv'),btn});});
function upgrade(i){const c=upCost(i);if(i>S.era||have(i)<c)return;spend(i,c);S.lvl[i]++;}
const _w=new THREE.Vector3(),_cd=new THREE.Vector3();
function updateLabels(text){_cd.copy(camera.position).normalize();
  STATIONS.forEach((s,i)=>{const L=LBL[i];if(i>S.era){L.d.hidden=true;return;}stationObjs[i].getWorldPosition(_w);const facing=_w.clone().normalize().dot(_cd);
    if(facing<0.25){L.d.hidden=true;return;}L.d.hidden=false;L.d.style.opacity=Math.min(1,(facing-.25)*5);
    const p=_w.clone().project(camera);const x=(p.x+1)/2*W,y=(1-p.y)/2*H;L.d.classList.toggle('compact',i!==sel);
    L.d.style.transform='translate('+x+'px,'+(y+6)+'px)';L.d.style.zIndex=i===sel?20:10;
    L.c.setAttribute('stroke-dashoffset',(106.8*(1-S.prog[i])).toFixed(1));
    if(text){L.amt.textContent=fmt(S.res[i])+' '+RES[i+1].name;L.b.textContent=S.lvl[i];L.lv.innerHTML='<span class="rate">level '+S.lvl[i]+' · '+fmt(outOf(i))+' / '+(s.time===1?'s':s.time+'s')+'</span>';
      const c=upCost(i);L.btn.innerHTML='Upgrade '+dot(i)+fmt(c);L.btn.classList.toggle('no',have(i)<c);}});}

/* ---- meteors ---- */
function meteor(shower){const m=document.createElement('button');m.className='meteor';m.setAttribute('aria-label','Golden meteor');
  const sx=shower?W/2+(Math.random()-.5)*W*.6:-40,sy=shower?-40:H*.3+Math.random()*H*.2,tx=shower?W/2+(Math.random()-.5)*W*.3:W+50,ty=shower?H*.5+(Math.random()-.5)*H*.2:sy+80,dur=shower?2.6:6;let p=0,alive=true;
  m.addEventListener('pointerdown',e=>{e.stopPropagation();alive=false;const g=Math.max(coinRate()*20,tapValue()*20);S.coins+=g;floatText('+'+fmt(g)+'!',e.clientX,e.clientY);m.remove();});
  overlay.appendChild(m);let lt=performance.now();(function mv(t){if(!alive)return;p+=(t-lt)/1000/dur;lt=t;if(p>=1){m.remove();return;}m.style.transform='translate('+(sx+(tx-sx)*p-19)+'px,'+(sy+(ty-sy)*p-19)+'px)';requestAnimationFrame(mv);})(lt);}
setInterval(()=>{if(!document.hidden&&Math.random()<.5)meteor(false);},30000);
setInterval(()=>{const names=CHARS.filter(c=>own(c.id)).map(c=>c.name);if(document.hidden||names.length<2)return;const a=names[Math.floor(Math.random()*names.length)];let b;do{b=names[Math.floor(Math.random()*names.length)];}while(b===a);news(NEWS[Math.floor(Math.random()*NEWS.length)].replace(/\{A\}/g,a).replace(/\{B\}/g,b));},26000);

/* ---- toolbar ---- */
const $=id=>document.getElementById(id);
$('pLook').onclick=()=>{close=!close;distTarget=close?fitDist*.5:fitDist;$('pLook').textContent=close?'Back to space':'Close look';};
$('pShower').onclick=()=>{const now=Date.now();if(now<S.showerAt){news('The next meteor shower is still on its way.');return;}S.boostUntil=now+45e3;S.showerAt=now+180e3;news('Meteor shower! Everything makes double for 45 seconds. Tap the golden meteors!');for(let i=0;i<10;i++)setTimeout(()=>meteor(true),i*4000+Math.random()*1500);};
$('pClouds').onclick=()=>{S.clouds=!S.clouds;applyToggles();};
$('pRing').onclick=()=>{S.ring=!S.ring;applyToggles();};
function applyToggles(){clouds.visible=S.clouds;ring.visible=S.ring;$('pClouds').textContent=S.clouds?'Clouds on':'Clouds off';$('pRing').textContent=S.ring?'Ring on':'Ring off';$('pClouds').classList.toggle('on',S.clouds);$('pRing').classList.toggle('on',S.ring);}
$('pSet').onclick=()=>openSheet('set');$('eraPill').onclick=()=>openSheet('planet');
$('tBuild').onclick=()=>openSheet('build');$('tCritters').onclick=()=>openSheet('critters');$('tPlanet').onclick=()=>openSheet('planet');

/* ---- sheets ---- */
const sheet=$('sheet'),scrim=$('scrim'),sb=$('sheetBody');let kind=null;
function openSheet(k){kind=k;sheet.hidden=scrim.hidden=false;renderSheet();}
function closeSheet(){kind=null;sheet.hidden=scrim.hidden=true;}
$('closeSheet').onclick=closeSheet;scrim.onclick=closeSheet;
function visibleChars(){const o=[];for(const c of CHARS){o.push(c);if(!own(c.id))break;}return o;}
function renderSheet(){const T=$('sheetTitle');
  if(kind==='critters'){T.textContent='Critters';sb.innerHTML=visibleChars().map(c=>{const locked=!own(c.id)&&S.coins<hirePrice(c)*.5;
    return '<div class="row'+(locked?' locked':'')+'"><div class="pic"><img src="'+IMGS[c.id]+'" alt=""></div><div class="info"><h3>'+(locked?'???':c.name)+(c.no&&!locked?'<span class="no">#'+c.no+'</span>':'')+'</h3><p>'+(own(c.id)?'Team of '+own(c.id)+' · ':'')+'+'+fmt(c.rate*coinMul())+' coins/s each</p></div><button class="big" data-hire="'+c.id+'">Hire<small>'+dot(0)+fmt(hirePrice(c))+'</small></button></div>';}).join('')+'<p class="note">Tap a critter on the planet and they say hi.</p>';}
  else if(kind==='build'){T.textContent='Build';sb.innerHTML=STATIONS.map((s,i)=>i>S.era?'<div class="row locked"><div class="pic"><i style="background:#555;color:#555"></i></div><div class="info"><h3>'+s.name+'</h3><p>Unlocks in the '+ERAS[i].name+'</p></div><span></span></div>'
    :'<div class="row"><div class="pic"><i style="background:'+RES[i+1].color+';color:'+RES[i+1].color+'"></i></div><div class="info"><h3>'+s.name+'</h3><p>Level '+S.lvl[i]+' · makes '+fmt(outOf(i))+' '+RES[i+1].name.toLowerCase()+' every '+(s.time===1?'second':s.time+' seconds')+'</p></div><button class="big" data-up="'+i+'">Upgrade<small>'+dot(i)+fmt(upCost(i))+'</small></button></div>').join('')+'<p class="note">Each building is upgraded with what the one before it makes.</p>';}
  else if(kind==='planet'){T.textContent='Planet';const nx=ERAS[S.era+1];let h='<div class="card"><h3>'+ERAS[S.era].name+'</h3><p>'+ERAS[S.era].blurb+'</p></div>';
    h+=nx?'<div class="row"><div class="pic"><i style="background:'+RES[S.era+1].color+';color:'+RES[S.era+1].color+'"></i></div><div class="info"><h3>Go to the '+nx.name+'</h3><p>'+nx.blurb+'</p></div><button class="big" data-era="1">Advance<small>'+dot(S.era+1)+fmt(nx.need)+'</small></button></div>'
      :'<div class="row"><div class="pic"><i style="background:'+RES[6].color+';color:'+RES[6].color+'"></i></div><div class="info"><h3>Launch to a new planet</h3><p>Start again in the Stone Age and keep your critters. Each star gives +50% on everything, forever. Stars: '+S.stars+'</p></div><button class="big" data-launch="1">Launch<small>'+dot(6)+fmt(LAUNCH)+'</small></button></div>';
    sb.innerHTML=h+'<p class="note">Each age is paid for with the newest thing your planet makes.</p>';}
  else{T.textContent='Settings';sb.innerHTML='<div class="row" style="grid-template-columns:1fr auto"><div class="info"><h3>Start over</h3><p>Wipes this planet, your critters and your stars.</p></div><button class="big" id="resetBtn" style="background:#ff5a7a;border-color:#ffc0cd;color:#fff">Start over</button></div><p class="note">Drag to spin the planet. Pinch or scroll to zoom. Your planet saves on this device.</p>';
    let armed=false;$('resetBtn').onclick=()=>{if(!armed){armed=true;$('resetBtn').textContent='Tap again';return;}S=fresh();clearSprites();rebuild();save();closeSheet();news('A brand new planet!');};}
  refreshSheet();}
function refreshSheet(){if(!kind)return;sb.querySelectorAll('[data-hire]').forEach(b=>b.disabled=S.coins<hirePrice(CHARS.find(c=>c.id===b.dataset.hire)));
  sb.querySelectorAll('[data-up]').forEach(b=>{const i=+b.dataset.up;b.disabled=have(i)<upCost(i);});
  const e=sb.querySelector('[data-era]');if(e)e.disabled=S.res[S.era]<ERAS[S.era+1].need;const l=sb.querySelector('[data-launch]');if(l)l.disabled=S.res[5]<LAUNCH;}
sb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.hire){const c=CHARS.find(x=>x.id===b.dataset.hire),p=hirePrice(c);if(S.coins>=p){const first=!own(c.id);S.coins-=p;S.owned[c.id]=own(c.id)+1;syncSprites();if(first)news(c.name+' moved to your planet!');renderSheet();save();}}
  else if(b.dataset.up){upgrade(+b.dataset.up);renderSheet();}
  else if(b.dataset.era){const n=ERAS[S.era+1];if(S.res[S.era]>=n.need){S.res[S.era]-=n.need;S.era++;S.lvl[S.era]=Math.max(1,S.lvl[S.era]);sel=S.era;rebuild();news('Welcome to the '+ERAS[S.era].name+'! The '+STATIONS[S.era].name+' is open.');closeSheet();save();}}
  else if(b.dataset.launch){if(S.res[5]>=LAUNCH){const keep={owned:S.owned,stars:S.stars+1,clouds:S.clouds,ring:S.ring};S=Object.assign(fresh(),keep);sel=0;rebuild();closeSheet();news('Liftoff! A new planet, and you now have '+S.stars+' star'+(S.stars>1?'s':'')+'.');save();}}});

/* ---- HUD ---- */
function hud(){
  const chips=[0].concat(STATIONS.map((s,i)=>i<=S.era?i+1:null).filter(x=>x!==null));
  $('chips').innerHTML=chips.map(r=>'<div class="chip">'+dot(r)+fmt(have(r===0?0:r)).replace(/^/,'')+'<span>'+RES[r].name+'</span></div>').join('')+'<div class="chip">'+dot(0)+fmt(coinRate())+'<span>coins/s</span></div>'+(S.stars?'<div class="chip">'+dot(6)+S.stars+'<span>stars</span></div>':'');
  $('eraNum').textContent=S.era+1;$('eraName').textContent=ERAS[S.era].name;const nx=ERAS[S.era+1];$('eraBar').style.width=(nx?Math.min(1,S.res[S.era]/nx.need):Math.min(1,S.res[5]/LAUNCH))*100+'%';
  $('dPlanet').hidden=nx?S.res[S.era]<nx.need:S.res[5]<LAUNCH;
  $('dCritters').hidden=!visibleChars().some(c=>S.coins>=hirePrice(c));
  $('dBuild').hidden=!STATIONS.some((s,i)=>i<=S.era&&have(i)>=upCost(i));
  const now=Date.now(),bo=$('boost');if(now<S.boostUntil){bo.hidden=false;bo.textContent='Double everything: '+Math.ceil((S.boostUntil-now)/1000)+'s';}else bo.hidden=true;
  const ps=$('pShower');if(now>=S.showerAt){ps.textContent='Meteor shower';ps.classList.add('hot');}else{ps.classList.remove('hot');const s=Math.ceil((S.showerAt-now)/1000);ps.textContent='Meteor shower '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  $('news').style.top=(document.querySelector('.top').offsetHeight+10)+'px';
  refreshSheet();
}
function rebuild(){paintPlanet();buildStations();buildTown();syncSprites();}

/* ---- loop ---- */
let last=performance.now(),tick=0;
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;step(dt);
  if(!drag){spinG.rotation.y+=velY*dt+0.025*dt;tilt.rotation.x=Math.max(-.8,Math.min(.9,tilt.rotation.x+velX*dt));const k=Math.pow(.04,dt);velY*=k;velX*=k;}
  clouds.rotation.y=spinG.rotation.y+t/60000;
  dist+=(distTarget-dist)*Math.min(1,dt*5);camera.position.set(0,dist*.06,dist);camera.lookAt(0,close?.25:0,0);
  anim.forEach(f=>f(t));moveWalkers(dt,t);renderer.render(scene,camera);
  tick-=dt;const txt=tick<=0;if(txt)tick=.15;updateLabels(txt);if(txt)hud();
  requestAnimationFrame(frame);}
function start(){resize();applyToggles();buildStations();buildTown();syncSprites();requestAnimationFrame(t=>{last=t;frame(t);});}
start();
</script>
